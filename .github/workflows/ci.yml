name: CI & Quality Gate Validation

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify:
    name: Run Verification Pipeline & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4.1.7
        with:
          fetch-depth: 0

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4.0.3
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Full Verification Pipeline (Data, Links, Diagrams, Frontmatter, Translations, Terminology, Profiles, Unit & E2E Tests, Site Build & Search Index)
        run: npm run verify
